[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "porta-pollster"
version = "0.1.0"
description = "Data-driven poll aggregation and election projection, with voter memory and attention modeling and optional AI explanations."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
ai = ["anthropic>=2.0"]
dev = ["pytest>=8"]

[project.scripts]
porta-pollster = "porta_pollster.cli:main"

[tool.setuptools.packages.find]
include = ["porta_pollster*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
